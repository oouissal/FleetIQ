# FleetIQ — Real-Time Supply Chain Intelligence Platform
# Full local stack: Kafka (KRaft) -> Spark Structured Streaming -> MinIO
#                  + MLflow + FastAPI + React
#
# Usage:
#   cp .env.example .env        # adjust secrets
#   docker compose up --build   # full stack
#   docker compose up --build --profile airflow   # + Airflow (batch only)
#
# Secrets come from .env (see .env.example); dev defaults are NOT secrets.
name: fleetiq

services:
  # ---------------------------------------------------------------- Kafka
  kafka:
    image: apache/kafka:3.9.1
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "fleetiq-dev-cluster-01"
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: >
      /bin/bash -c "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic fleet.telemetry --partitions 3 --replication-factor 1 && /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic fleet.gps --partitions 3 --replication-factor 1 && /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic fleet.delivery --partitions 3 --replication-factor 1 && echo 'Kafka topics ready'"
    restart: "no"

  # ---------------------------------------------------------------- MinIO
  # NOTE: the MinIO images are unreachable from the public registries in
  # some environments (docker.io: pull denied; quay.io: 401; ghcr.io: denied
  # as of 2026-10). If the pull fails for you, run the stack with the
  # filesystem storage override:
  #   docker compose -f docker-compose.yml -f docker-compose.fs.yml up --build
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-fleetiq}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-fleetiq-dev-password}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  minio-buckets:
    build:
      context: .
      dockerfile: docker/data-init/Dockerfile
    entrypoint:
      - /bin/sh
      - -c
      - |
        python - <<'PY'
        import os
        import boto3
        from botocore.client import Config

        s3 = boto3.client(
            's3',
            endpoint_url='http://minio:9000',
            aws_access_key_id=os.environ['S3_ACCESS_KEY'],
            aws_secret_access_key=os.environ['S3_SECRET_KEY'],
            config=Config(signature_version='s3v4'),
        )

        for bucket in ['bronze', 'silver', 'gold', 'mlflow', 'checkpoints', 'raw']:
            try:
                s3.create_bucket(Bucket=bucket)
            except Exception:
                pass

        print('buckets ready')
        PY
    environment:
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-fleetiq}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-fleetiq-dev-password}
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  # ---------------------------------------------------------------- MLflow
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.16.1
    command: mlflow server --host 0.0.0.0 --port 5000
    environment:
      MLFLOW_ALLOW_FILE_STORE: "true"
      MLFLOW_BACKEND_STORE_URI: sqlite:////mlflow/mlflow.db
      MLFLOW_DEFAULT_ARTIFACT_ROOT: s3://mlflow
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      MLFLOW_S3_IGNORE_TLS: "true"
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-fleetiq}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-fleetiq-dev-password}
    ports:
      - "5001:5000"
    volumes:
      - mlflow-data:/mlflow
    depends_on:
      minio-buckets:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=3)"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s

  # --------------------------------------- one-shot data + model bootstrap
  data-init:
    build:
      context: .
      dockerfile: docker/data-init/Dockerfile
    environment:
      MLFLOW_ALLOW_FILE_STORE: "true"
      MLFLOW_TRACKING_URI: file:///mlflow
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-fleetiq}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-fleetiq-dev-password}
      GENERATOR_VEHICLES: ${GENERATOR_VEHICLES:-150}
      GENERATOR_EVENTS: ${GENERATOR_EVENTS:-150000}
      GENERATOR_SEED: ${GENERATOR_SEED:-42}
    volumes:
      - fleetiq-data:/data
      - mlflow-data:/mlflow
    depends_on:
      mlflow:
        condition: service_healthy
      minio-buckets:
        condition: service_completed_successfully
    restart: "no"

  # ------------------------------------------ continuous synthetic stream
  generator:
    build:
      context: .
      dockerfile: docker/data-init/Dockerfile
    command: >
      python -m data_generator --stream
        --vehicles ${GENERATOR_STREAM_VEHICLES:-100}
        --speed ${GENERATOR_EVENTS_PER_SECOND:-50}
        --duration 0
        --kafka-bootstrap kafka:9092
        --seed ${GENERATOR_SEED:-42}
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # ------------------------------------------------ Spark streaming engine
  spark:
    build:
      context: .
      dockerfile: docker/spark/Dockerfile
    environment:
      FLEETIQ_KAFKA_BOOTSTRAP: kafka:9092
      FLEETIQ_LAKE_BASE: s3a://
      FLEETIQ_BRONZE_PATH: s3a://bronze
      FLEETIQ_SILVER_PATH: s3a://silver
      FLEETIQ_GOLD_PATH: s3a://gold
      FLEETIQ_CHECKPOINT_PATH: s3a://checkpoints
      FLEETIQ_S3_ENDPOINT: http://minio:9000
      FLEETIQ_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-fleetiq}
      FLEETIQ_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-fleetiq-dev-password}
    ports:
      - "4040:4040"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      minio-buckets:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:4040/api/v1/applications', timeout=3)"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s
    restart: unless-stopped

  # ------------------------------------------------------- FastAPI backend
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    environment:
      MLFLOW_ALLOW_FILE_STORE: "true"
      FLEETIQ_LAKE_BASE: s3a://
      FLEETIQ_GOLD_ROOT: s3a://gold
      FLEETIQ_RAW_ROOT: s3://raw
      FLEETIQ_S3_ENDPOINT: http://minio:9000
      FLEETIQ_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-fleetiq}
      FLEETIQ_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-fleetiq-dev-password}
      FLEETIQ_MLFLOW_TRACKING_URI: file:///mlflow
      FLEETIQ_RESULTS_META_DIR: /data/ml_meta
      FLEETIQ_ANOMALY_META_DIR: /data/gold/anomalies
      FLEETIQ_CORS_ORIGINS: http://localhost:8081,http://localhost:5173,http://localhost
    ports:
      - "8002:8000"
    volumes:
      - fleetiq-data:/data
      - mlflow-data:/mlflow
    depends_on:
      data-init:
        condition: service_completed_successfully
      mlflow:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 30s

  # --------------------------------------------------------- React frontend
  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    ports:
      - "8081:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 20s
      timeout: 10s
      retries: 5

  # ----------------------------------------- Airflow (batch pipeline only)
  airflow:
    image: apache/airflow:2.10.5-python3.11
    profiles: ["airflow"]
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    command: standalone
    ports:
      - "8082:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./data:/opt/airflow/data
      - ./ml:/opt/airflow/ml
      - ./data_quality:/opt/airflow/data_quality
      - ./streaming:/opt/airflow/streaming
      - ./data_lake:/opt/airflow/data_lake
      - ./monitoring:/opt/airflow/monitoring
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 8
      start_period: 60s

volumes:
  kafka-data:
  minio-data:
  mlflow-data:
  fleetiq-data:

